[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-workbench"
description = "XAUUSDc USC account workbench for MetaTrader 5"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies", "version"]

[project.gui-scripts]
mt5-workbench = "mt5_workbench.ui.qml_app:main"

[tool.setuptools.dynamic]
version = {attr = "mt5_workbench.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mt5_workbench.ui" = [
    "qml/*.qml",
    "resources/icons/*.png",
    "resources/icons/svg/dark/*.svg",
    "resources/icons/svg/light/*.svg",
]
