name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -e . -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Install failed" }
      - name: Validate release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $appVersion = & ./.venv/Scripts/python.exe -c "from mt5_workbench import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -cne "v$appVersion") { throw "Tag must match __version__: v$appVersion" }
      - name: Offline tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          MT5_WORKBENCH_DATA_DIR: ${{ runner.temp }}/mt5-workbench-tests
        run: |
          ./.venv/Scripts/python.exe -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
      - name: Build single-file EXE
        run: ./build.ps1 -SkipInstall
      - name: Verify frozen QML application without connecting MT5
        run: |
          $appProcess = Start-Process -FilePath ./dist/MT5Workbench.exe -ArgumentList @("--smoke-test", "build/frozen-smoke") -WindowStyle Hidden -Wait -PassThru
          if ($appProcess.ExitCode -ne 0) { throw "Frozen application smoke test failed" }
          if (-not (Test-Path build/frozen-smoke/result.json)) { throw "Missing smoke test result" }
          $result = Get-Content build/frozen-smoke/result.json -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "QML smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: MT5Workbench-Windows-x64
          path: |
            dist/MT5Workbench.exe
            dist/MT5Workbench-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release with verified binaries
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ./dist/MT5Workbench.exe ./dist/MT5Workbench-Windows-x64.zip ./dist/SHA256SUMS.txt --verify-tag --generate-notes --title "MT5 Workbench $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
